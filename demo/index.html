<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演示银行 · AI Banking 沙箱</title>
<style>
  :root {
    --bg: #0d1220; --card: #161d31; --card2: #1c2440; --line: #26304f;
    --txt: #e8ecf6; --dim: #8b96b3; --acc: #5b7cfa; --acc2: #7c5bfa;
    --ok: #34c98e; --warn: #f5a623; --bad: #f0564f; --gold: #e6c26a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: "Microsoft YaHei", system-ui, sans-serif; min-height: 100vh; }
  header { padding: 18px 28px; background: linear-gradient(135deg, #141b30, #1a2242); border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 19px; }
  header h1 span { color: var(--acc); }
  header .sub { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .badge { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: #fff; font-size: 12px;
           padding: 4px 12px; border-radius: 20px; }
  nav { display: flex; gap: 6px; padding: 12px 28px 0; flex-wrap: wrap; }
  nav button { background: var(--card); color: var(--dim); border: 1px solid var(--line); padding: 9px 16px;
               border-radius: 10px 10px 0 0; cursor: pointer; font-size: 14px; }
  nav button.on { color: var(--txt); background: var(--card2); border-bottom: 2px solid var(--acc); }
  main { padding: 18px 28px 40px; max-width: 1080px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h3 { font-size: 14px; color: var(--dim); font-weight: normal; margin-bottom: 10px; }
  .money { font-size: 26px; font-weight: 600; letter-spacing: .5px; }
  .money small { font-size: 13px; color: var(--dim); font-weight: normal; }
  .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: normal; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 6px; border-bottom: 1px solid #1e2742; }
  .out { color: var(--txt); } .in { color: var(--ok); }
  input, select, textarea { background: var(--card2); border: 1px solid var(--line); color: var(--txt);
         border-radius: 8px; padding: 9px 11px; font-size: 14px; width: 100%; }
  .btn { background: linear-gradient(90deg, var(--acc), var(--acc2)); border: none; color: #fff; padding: 10px 18px;
         border-radius: 9px; cursor: pointer; font-size: 14px; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
  .btn.small { padding: 5px 12px; font-size: 12px; }
  .btn.danger { background: linear-gradient(90deg, #d9534f, #b03a36); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .form { display: grid; gap: 10px; }
  .form label { font-size: 12px; color: var(--dim); display: block; margin-bottom: 4px; }
  .confirm-box { border: 1px solid var(--gold); background: #2a2417; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .confirm-box .t { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
  .msg { border-radius: 9px; padding: 10px 13px; font-size: 13px; margin-top: 10px; }
  .msg.ok { background: #12281e; color: var(--ok); border: 1px solid #1e4b39; }
  .msg.err { background: #2b1a1a; color: var(--bad); border: 1px solid #57201e; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 11px; }
  .pill.R1 { background: #16321f; color: var(--ok); } .pill.R2 { background: #2b2413; color: var(--warn); }
  .pill.R3, .pill.R4, .pill.R5 { background: #331a1a; color: var(--bad); }
  .pill.active { background: #16321f; color: var(--ok); }
  .pill.locked { background: #2b2413; color: var(--warn); } .pill.lost { background: #331a1a; color: var(--bad); }
  .pill.collecting { background: #16321f; color: var(--ok); }
  .hl { color: var(--warn); }
  .muted { color: var(--dim); font-size: 12px; }
  .steps li { margin: 8px 0 8px 18px; font-size: 13px; }
  .anomaly { border-left: 3px solid var(--bad); padding: 10px 12px; background: var(--card2);
             border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
  .anomaly b { color: var(--bad); }
  .hidden { display: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  footer { text-align: center; color: #55617f; font-size: 11px; padding: 18px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏦 演示银行 <span>AI Banking 沙箱</span></h1>
    <div class="sub">户主：陈明 · 所有数据均为虚构种子数据 · 动钱操作需两步确认</div>
  </div>
  <div class="badge" id="riskBadge">风险等级 C3</div>
</header>

<nav id="nav"></nav>
<main id="main"></main>
<footer>bank_core 演示网关 · python -m bank_core.web_api · 正式产品形态见 docs/AI-Banking-Agent-产品研发计划.md</footer>

<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const yuan = (s) => '¥' + s;
const fmt = (ts) => (ts || '').replace('T', ' ').slice(5, 16);
const CAT_COLOR = {};

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function msg(el, text, ok = true) {
  const m = document.createElement('div');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
  el.appendChild(m);
  setTimeout(() => m.remove(), 6000);
}

const TABS = {
  '总览': tabOverview, '智能转账': tabTransfer, '账单分析': tabReport,
  '订阅管家': tabSubs, '异常检测': tabAnomaly, '理财': tabWealth,
  '卡片管理': tabCards, '日历联动': tabEvents,
};
const nav = document.getElementById('nav'), main = document.getElementById('main');
Object.keys(TABS).forEach((name, i) => {
  const b = document.createElement('button');
  b.textContent = name;
  if (i === 0) b.classList.add('on');
  b.onclick = () => { nav.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); TABS[name](); };
  nav.appendChild(b);
});

function section(title, note) {
  main.innerHTML = '';
  const c = $('<div class="card"></div>');
  c.appendChild($(`<h3>${title}${note ? ` <span class="muted">· ${note}</span>` : ''}</h3>`));
  main.appendChild(c);
  return c;
}

/* ---------------- 总览 ---------------- */
async function tabOverview() {
  const c = section('账户总览', '实时余额');
  const accts = await api('/api/accounts');
  const grid = $('<div class="grid"></div>');
  accts.forEach(a => grid.appendChild($(`
    <div class="card" style="background:linear-gradient(135deg,#1b2547,#151c33)">
      <h3>${a.name} · ${a.type === 'checking' ? '活期' : '储蓄'}</h3>
      <div class="money">${yuan(a.balance_yuan)} <small>CNY</small></div>
      <div class="muted" style="margin-top:8px">账户号 0000${a.id} · 开户 ${fmt(a.opened_at).slice(0,5)}</div>
    </div>`)));
  c.appendChild(grid);

  const t = await api('/api/transactions?limit=15');
  const card2 = $('<div class="card" style="margin-top:14px"><h3>最近交易</h3></div>');
  const tbl = $(`<table><tr><th>时间</th><th>对方</th><th>分类</th><th style="text-align:right">金额</th><th style="text-align:right">余额</th></tr></table>`);
  t.forEach(x => tbl.appendChild($(`<tr>
    <td>${fmt(x.ts)}</td><td>${x.counterparty}</td><td class="muted">${x.category}</td>
    <td style="text-align:right" class="${x.direction}">${x.direction === 'out' ? '-' : '+'}${yuan(x.amount_yuan)}</td>
    <td style="text-align:right" class="muted">${yuan(x.balance_after_yuan)}</td></tr>`)));
  card2.appendChild(tbl);
  c.appendChild(card2);
}

/* ---------------- 智能转账（两步确认） ---------------- */
async function tabTransfer() {
  const c = section('智能转账', '建单 → 确认 → 执行；单笔限额5万 / 日累计1万');
  const contacts = await api('/api/contacts');
  const wrap = $('<div class="two"></div>');
  const form = $('<div class="card"><h3>填写转账</h3><div class="form"></div></div>');
  const f = form.querySelector('.form');
  const sel = $('<select></select>');
  contacts.filter(x => x.relation !== 'daughter').forEach(x =>
    sel.appendChild($(`<option value="${x.id}">${x.name}（${x.relation === 'spouse' ? '家人' : x.relation === 'landlord' ? '房东' : '联系人'}）</option>`)));
  const amount = $('<input placeholder="金额（元），如 500 或 520.00">');
  const memo = $('<input placeholder="备注（可空），如 下周家用">');
  const sched = $('<input type="datetime-local" title="留空=立即转账">');
  const submit = $('<button class="btn">生成转账单</button>');
  const field = (label, input) => { const d = document.createElement('div');
    const l = document.createElement('label'); l.textContent = label;
    d.appendChild(l); d.appendChild(input); return d; };
  f.append(field('收款人', sel), field('金额（元）', amount), field('备注', memo),
           field('定时时间（可空，立即转账则不填）', sched), submit);
  wrap.appendChild(form);

  const status = $('<div class="card"><h3>转账单状态</h3><div class="muted">等待填写…</div></div>');
  wrap.appendChild(status);
  c.appendChild(wrap);

  submit.onclick = async () => {
    status.innerHTML = '<h3>转账单状态</h3>';
    try {
      const body = { to_contact_id: +sel.value, amount_yuan: amount.value.trim(), memo: memo.value.trim() };
      if (sched.value) body.scheduled_at = sched.value + ':00';
      const order = await api('/api/transfer/order', { method: 'POST', body: JSON.stringify(body) });
      if (order.status === 'scheduled') {
        msg(status, `✅ 定时转账单已创建：${order.to_name} ${yuan(order.amount_yuan)}，将于 ${fmt(order.scheduled_at)} 到期，届时需确认执行`, true);
        return;
      }
      const box = $(`<div class="confirm-box">
        <div class="t">⚠️ 请确认转账单 #${order.id}</div>
        <div class="row"><span class="k">收款人</span><span>${order.to_name}</span></div>
        <div class="row"><span class="k">金额</span><span style="color:var(--gold);font-size:18px">${yuan(order.amount_yuan)}</span></div>
        <div class="row"><span class="k">备注</span><span>${order.memo || '—'}</span></div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn" id="ok">✔ 确认执行</button>
          <button class="btn ghost" id="no">✖ 取消</button>
        </div></div>`);
      status.appendChild(box);
      box.querySelector('#ok').onclick = async () => {
        try {
          const res = await api('/api/transfer/confirm', { method: 'POST', body: JSON.stringify({ order_id: order.id }) });
          box.remove();
          msg(status, `✅ 转账成功：${res.to_name} ${yuan(res.amount_yuan)}，余额 ${yuan(res.balance_after_yuan)}`, true);
        } catch (e) { msg(status, '❌ ' + e.message, false); }
      };
      box.querySelector('#no').onclick = async () => {
        await api('/api/transfer/cancel', { method: 'POST', body: JSON.stringify({ order_id: order.id }) });
        box.remove(); msg(status, '已取消转账单', true);
      };
    } catch (e) { msg(status, '❌ ' + e.message, false); }
  };
}

/* ---------------- 账单分析 ---------------- */
async function tabReport() {
  const c = section('账单分析', '收支/分类/环比（已排除内部划转）');
  const now = new Date(), months = [];
  for (let i = 0; i < 6; i++) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const bar = $('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>');
  months.forEach((m, i) => {
    const b = $(`<button class="btn small ${i ? 'ghost':''}">${m}</button>`);
    b.onclick = async () => {
      bar.querySelectorAll('button').forEach(x => x.className = 'btn small ghost');
      b.className = 'btn small';
      await load(m);
    };
    bar.appendChild(b);
  });
  c.appendChild(bar);
  const out = $('<div></div>'); c.appendChild(out);

  async function load(m) {
    out.innerHTML = '';
    const r = await api(`/api/report/${m}`);
    const grid = $('<div class="grid"></div>');
    grid.appendChild($(`<div class="card"><h3>收入</h3><div class="money" style="color:var(--ok)">${yuan(r.income_yuan)}</div>
      ${r.mom_income_pct !== null ? `<div class="muted">环比 ${r.mom_income_pct > 0 ? '+' : ''}${r.mom_income_pct}%</div>` : ''}</div>`));
    grid.appendChild($(`<div class="card"><h3>支出</h3><div class="money">${yuan(r.expense_yuan)}</div>
      ${r.mom_expense_pct !== null ? `<div class="muted">环比 <span class="${r.mom_expense_pct > 20 ? 'hl':''}">${r.mom_expense_pct > 0 ? '+' : ''}${r.mom_expense_pct}%</span></div>` : ''}</div>`));
    grid.appendChild($(`<div class="card"><h3>结余 / 储蓄率</h3><div class="money">${yuan(r.net_yuan)}</div>
      <div class="muted">储蓄率 ${r.savings_rate_pct ?? '—'}%</div></div>`));
    out.appendChild(grid);
    const card2 = $('<div class="card" style="margin-top:14px"><h3>分类构成</h3></div>');
    const max = Math.max(...r.top_categories.map(x => parseFloat(x.amount_yuan)), 1);
    r.top_categories.forEach(x => card2.appendChild($(`
      <div style="margin:10px 0">
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span>${x.category} <span class="muted">${x.count}笔</span></span>
          <span>${yuan(x.amount_yuan)} · ${x.pct}%</span></div>
        <div style="height:6px;background:#1e2742;border-radius:4px;margin-top:5px">
          <div style="height:6px;width:${parseFloat(x.amount_yuan)/max*100}%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:4px"></div>
        </div></div>`)));
    out.appendChild(card2);
  }
  await load(months[0]);
}

/* ---------------- 订阅管家 ---------------- */
async function tabSubs() {
  const c = section('订阅管家', '自动挖掘周期性扣费 · 一键取消代扣');
  const subs = await api('/api/subscriptions?refresh=true');
  const grid = $('<div class="grid"></div>');
  subs.filter(s => s.status === 'active').forEach(s => {
    const card = $(`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${s.merchant}</b><span class="muted">${s.period_days}天/期</span></div>
      <div class="money" style="font-size:20px;margin:8px 0">${yuan(s.amount_yuan)}<small> /期</small></div>
      <div class="row"><span class="k">下次扣费</span><span>${s.next_charge_date}</span></div>
      <div class="row"><span class="k">年化成本</span><span class="hl">${yuan(s.annual_cost_yuan)}/年</span></div>
      ${s.price_change ? `<div class="msg err" style="margin-top:8px">⚠️ ${s.price_change}</div>` : ''}
      <button class="btn danger small" style="margin-top:12px">取消代扣</button></div>`);
    card.querySelector('button').onclick = async () => {
      if (!confirm(`确认取消「${s.merchant}」的自动代扣？下次将不再扣费。`)) return;
      try { await api('/api/subscriptions/cancel', { method: 'POST', body: JSON.stringify({ subscription_id: s.id }) });
            card.style.opacity = .4; card.querySelector('button').disabled = true; card.querySelector('button').textContent = '已取消';
      } catch (e) { alert(e.message); }
    };
    grid.appendChild(card);
  });
  if (!subs.filter(s => s.status === 'active').length) grid.appendChild($('<div class="muted">没有识别到活跃订阅</div>'));
  c.appendChild(grid);
}

/* ---------------- 异常检测 ---------------- */
async function tabAnomaly() {
  const c = section('异常检测', '确定性规则：重复扣款 / 大额离群 / 凌晨大额');
  const list = await api('/api/anomalies?days=90');
  if (!list.length) c.appendChild($('<div class="muted">近 90 天未发现异常 ✔</div>'));
  list.forEach(a => c.appendChild($(`<div class="anomaly">
    <b>${a.rule}</b> &nbsp;<span class="muted">${a.ts ? fmt(a.ts) : ''}</span>
    <div style="margin-top:6px">${a.evidence}</div>
    <div class="muted" style="margin-top:4px">建议：${a.suggest}</div></div>`)));
}

/* ---------------- 理财 ---------------- */
async function tabWealth() {
  const c = section('理财超市', '风险匹配（您为 C3，可购 R1-R3）· 申购两步确认');
  const risk = await api('/api/risk');
  document.getElementById('riskBadge').textContent = `风险等级 ${risk.level ?? '—'}`;
  const prods = await api('/api/products');
  const tbl = $('<table><tr><th>产品</th><th>类型</th><th>风险</th><th>业绩基准</th><th>起购</th><th>操作</th></tr></table>');
  prods.forEach(p => {
    const allowed = +p.risk_level.slice(1) <= +((risk.level || 'C3').slice(1));
    const tr = $(`<tr>
      <td title="${p.intro}">${p.name}</td><td class="muted">${{money_fund:'货基',bond:'债基',mixed:'混合',gold:'黄金',deposit:'存款'}[p.p_type]}</td>
      <td><span class="pill ${p.risk_level}">${p.risk_level}</span></td>
      <td>${p.expected_return_pct}%</td><td>${yuan(p.min_subscribe_yuan)}</td>
      <td><button class="btn small" ${allowed ? '' : 'disabled title="超出风险等级"'}>申购</button></td></tr>`);
    tr.querySelector('button').onclick = () => subDialog(p, allowed);
    tbl.appendChild(tr);
  });
  c.appendChild(tbl);

  function subDialog(p, allowed) {
    const amt = prompt(`申购「${p.name}」（R${p.risk_level.slice(1)}，基准 ${p.expected_return_pct}%）\n请输入金额（元），起购 ${p.min_subscribe_yuan}：`, '1000');
    if (!amt) return;
    api('/api/wealth/subscribe', { method: 'POST', body: JSON.stringify({ product_id: p.id, amount_yuan: amt, confirmed: false }) })
      .then(r => {
        if (!confirm(`确认申购单：${p.name} ${yuan(r.amount_yuan)}？\n（费用与风险已核对，确认后立即扣款）`)) return;
        return api('/api/wealth/subscribe', { method: 'POST', body: JSON.stringify({ product_id: p.id, amount_yuan: amt, confirmed: true }) });
      })
      .then(r => { if (r) alert(`✅ 申购成功：${r.product} ${yuan(r.amount_yuan)}（手续费 ${r.fee_yuan}），余额 ${yuan(r.balance_after_yuan)}`); tabWealth(); })
      .catch(e => alert('❌ ' + e.message));
  }

  const holds = await api('/api/holdings');
  if (holds.length) {
    const c2 = $('<div class="card" style="margin-top:14px"><h3>当前持仓</h3></div>');
    const t2 = $('<table><tr><th>产品</th><th>本金</th><th>最新市值</th><th>收益</th><th>操作</th></tr></table>');
    holds.forEach(h => {
      const tr = $(`<tr><td>${h.product}</td><td>${yuan(h.principal_yuan)}</td><td>${yuan(h.est_value_yuan)}</td>
        <td class="${parseFloat(h.profit_yuan) >= 0 ? 'in':'out'}">${h.profit_pct}%</td>
        <td><button class="btn small ghost">赎回</button></td></tr>`);
      tr.querySelector('button').onclick = async () => {
        const r = await api('/api/wealth/redeem', { method: 'POST', body: JSON.stringify({ holding_id: h.holding_id, confirmed: false }) });
        if (!confirm(`确认全额赎回「${r.product}」？到手 ${yuan(r.redeem_net_yuan)}`)) return;
        const res = await api('/api/wealth/redeem', { method: 'POST', body: JSON.stringify({ holding_id: h.holding_id, confirmed: true }) });
        alert(`✅ 赎回到账 ${yuan(res.redeem_net_yuan)}`); tabWealth();
      };
      t2.appendChild(tr);
    });
    c2.appendChild(t2); c.appendChild(c2);
  }
}

/* ---------------- 卡片管理 ---------------- */
async function tabCards() {
  const c = section('卡片管理', '锁定/解锁/挂失（挂失不可逆）· 限额调整');
  const cards = await api('/api/cards');
  const grid = $('<div class="grid"></div>');
  cards.forEach(x => {
    const card = $(`<div class="card">
      <div style="display:flex;justify-content:space-between">
        <b>${x.card_no_masked}</b><span class="pill ${x.status}">${{active:'正常',locked:'已锁定',lost:'已挂失',frozen:'冻结'}[x.status]}</span></div>
      <div class="muted" style="margin:6px 0 10px">${x.card_type === 'debit' ? '借记卡' : '信用卡'} · 单笔限额 ${yuan(x.per_tx_limit_yuan)} · 日限额 ${yuan(x.daily_limit_yuan)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small ghost" data-a="locked" ${x.status !== 'active' ? 'disabled':''}>🔒 锁定</button>
        <button class="btn small ghost" data-a="active" ${x.status === 'active' ? 'disabled':''}>🔓 解锁</button>
        <button class="btn small danger" data-a="lost" ${x.status === 'lost' ? 'disabled':''}>⚠️ 挂失</button>
      </div></div>`);
    card.querySelectorAll('button[data-a]').forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'lost' && !confirm(`挂失后不可恢复，确认挂失 ${x.card_no_masked}？`)) return;
      try { await api('/api/cards/status', { method: 'POST', body: JSON.stringify({ card_id: x.id, status: a }) }); tabCards(); }
      catch (e) { alert('❌ ' + e.message); }
    });
    grid.appendChild(card);
  });
  c.appendChild(grid);
}

/* ---------------- 日历联动 ---------------- */
async function tabEvents() {
  const c = section('日历联动', '好记性：记住日子 → 主动提醒 → 只建议不越权');
  const evs = await api('/api/events?upcoming_days=120');
  const grid = $('<div class="grid"></div>');
  evs.forEach(e => {
    const card = $(`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${e.title}</b>
        <span class="pill ${e.days_left <= 30 ? 'R2' : 'R1'}">${e.days_left <= 0 ? '今天' : e.days_left + ' 天后'}</span></div>
      <div class="muted" style="margin:6px 0">${e.date} ${e.repeat_yearly ? '· 每年重复' : ''}</div>
      <button class="btn small">生成联动计划</button>
      <div class="plan"></div></div>`);
    card.querySelector('button').onclick = async () => {
      const p = await api(`/api/linkage/${e.id}`);
      const box = card.querySelector('.plan');
      box.innerHTML = `<div class="confirm-box" style="margin-top:10px"><div class="t">📋 联动计划草稿（${p.days_left} 天后）</div>
        <ul class="steps">${p.steps.map(s => `<li>${s.suggest}${s.run_at ? `（${s.run_at}）` : ''}</li>`).join('')}</ul>
        <div class="muted">${p.note}</div></div>`;
    };
    grid.appendChild(card);
  });
  c.appendChild(grid);

  const c2 = $('<div class="card" style="margin-top:14px"><h3>待办任务（定时转账/提醒）</h3></div>');
  const tasks = await api('/api/tasks');
  const t = $('<table><tr><th>类型</th><th>执行时间</th><th>内容</th></tr></table>');
  tasks.forEach(x => t.appendChild($(`<tr><td>${x.type === 'scheduled_transfer' ? '定时转账' : '提醒'}</td>
    <td>${fmt(x.run_at)}</td><td>${x.payload.title || '—'}</td></tr>`)));
  c2.appendChild(t);
  const run = $('<button class="btn" style="margin-top:12px">▶ 模拟时间到达（触发到期任务）</button>');
  run.onclick = async () => {
    const fired = await api('/api/tasks/run', { method: 'POST' });
    alert(fired.length ? fired.map(f => f.message).join('\n') : '当前没有到期任务');
    tabEvents();
  };
  c2.appendChild(run);
  c.appendChild(c2);
}

tabOverview();
</script>
