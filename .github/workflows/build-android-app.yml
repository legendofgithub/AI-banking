name: build-android-app

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK(平台/构建工具/许可证),
      # 这里只固定 Gradle 版本,不做任何本机安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p mobile-app assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bankagent-apk
          path: mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
