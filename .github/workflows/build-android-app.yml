name: build-android-app

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-android-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # 发布 Release 需要写 contents(默认 GITHUB_TOKEN 是只读)
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK(平台/构建工具/许可证),
      # 这里只固定 Gradle 版本,不做任何本机安装
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 版本号:run_number 单调递增,App 内更新检查按 versionCode 比大小;
      # versionName 带日期便于人读
      - name: Compute version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}.$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p mobile-app assembleDebug --no-daemon
             -PappVersionCode="${VERSION_CODE}" -PappVersionName="${VERSION_NAME}"

      # 版本清单:App 启动时拉 /app/version.json 比对;sha256 供下载后校验
      - name: Write version manifest
        run: |
          cd mobile-app/app/build/outputs/apk/debug
          SHA="$(sha256sum app-debug.apk | cut -d' ' -f1)"
          cat > version.json <<JSON
          {"versionCode": ${VERSION_CODE}, "versionName": "${VERSION_NAME}", "apk": "app/bankagent.apk", "sha256": "${SHA}"}
          JSON
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: bankagent-apk
          path: |
            mobile-app/app/build/outputs/apk/debug/app-debug.apk
            mobile-app/app/build/outputs/apk/debug/version.json
          if-no-files-found: error

      # 公网分发:APK 发布到固定 tag「app」的 Release,扫码直链
      #   https://github.com/<owner>/<repo>/releases/latest/download/bankagent.apk
      # 永远指向最新一次构建——发新版不用换二维码,也不依赖演示本机。
      # tag 已存在时 create 失败,回落到 upload --clobber 覆盖资产。
      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/mobile-app'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd mobile-app/app/build/outputs/apk/debug
          cp app-debug.apk bankagent.apk
          gh release create app bankagent.apk version.json \
            --title "Android App(自动构建)" \
            --notes "versionCode=${VERSION_CODE} versionName=${VERSION_NAME} commit=${GITHUB_SHA}" \
          || gh release upload app bankagent.apk version.json --clobber
