plugins {
    id "com.android.application"
}

android {
    namespace = "com.aibanking.app"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.aibanking.app"
        minSdk = 24
        targetSdk = 35
        // 版本号由 CI 注入(-PappVersionCode/-PappVersionName;workflow 用
        // run_number 保证单调递增,App 内更新按 versionCode 比大小)
        versionCode = (project.findProperty('appVersionCode') ?: '1') as Integer
        versionName = (project.findProperty('appVersionName') ?: '1.0') as String
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// 纯系统 WebView 壳,不引入任何依赖
dependencies {
}
